[tools]
android-sdk = "23.0"
java = "temurin-25.0.5+8.0.LTS"
node = "26"

[tasks.android-setup]
description = "Install the Android SDK packages required for the build"
interactive = true
run = 'android --sdk="$(mise where android-sdk)" sdk install platforms/android-36 build-tools/35.0.0 platform-tools'

[tasks.build]
description = "Build the debug APK"
run = "bash ./gradlew :uhabits-android:assembleDebug && echo 'uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk'"

[tasks.web]
description = "Run the web app server"
depends = ["web-core"]
run = "node --no-warnings web/src/server.ts"

[tasks.web-dev]
description = "Restart the web app server when web files change"
dir = "web"
run = "node --run dev"

[tasks.web-core]
description = "Build the shared Android core for the web app"
run = "./gradlew :uhabits-core:jsBrowserProductionLibraryDistribution"
